name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Ubuntu tests (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s . -p 'test_*.py' -v 2>&1 | tee tests.log
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-python-${{ matrix.python }}
          path: tests.log
          if-no-files-found: ignore

  acceptance:
    name: Acceptance
    needs: tests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require full test matrix
        run: test '${{ needs.tests.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Require a new version for the PR
        if: github.event_name == 'pull_request'
        run: python tools/check_release.py --unreleased
      - name: Release metadata and protected engine
        run: python tools/check_release.py --output acceptance.json
      - name: CSV dependency, crash recovery and date acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest test_csv_pipeline -v 2>&1 | tee acceptance.log
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance
          path: |
            acceptance.json
            acceptance.log
          if-no-files-found: ignore
